name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false  # no dependencies, nothing to cache

      - name: Run tests
        run: go test -v -race ./... -coverprofile=coverage.out

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
