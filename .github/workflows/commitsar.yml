name: Commitsar

on: [pull_request]

permissions:
  contents: read

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commitsar check
        uses: aevea/commitsar@v1.0.3
