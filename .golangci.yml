# Golangci-lint documentation: https://golangci-lint.run/
version: "2"

run:
  # Disable tests to avoid redundancy with test workflow
  tests: false

linters:
  enable:
    - dupl
    - goconst
    - gocyclo
    - godox
    - lll
    - misspell
    - modernize
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  # Maximum count of issues with the same text
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
